<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161E">
<title>Finacle Desk — India Post counter reference</title>
<script>(function(){try{var t=localStorage.getItem("fd-theme");if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
:root{
  /* light theme */
  --bg:#EEF1F4;
  --bg-2:#E4E9EF;
  --card:#FFFFFF;
  --card-2:#F5F8FA;
  --ink:#141B24;
  --ink-2:#3D4E60;
  --dim:#66788B;
  --line:#D6DDE5;
  --line-soft:#E5EAF0;
  --accent:#C8102E;
  --accent-ink:#96001F;
  --accent-soft:#FDE9EC;
  --accent-line:#F2CBD1;
  --gold:#B57A00;
  --gold-bg:#FFF6E0;
  --gold-line:#EDD9A6;
  --green:#0B6E4F;
  --green-bg:#E6F4EE;
  --green-line:#BFE3D3;
  --warn-bg:#FFF3F4;
  --code-bg:#F1E9DC;
  --code-ink:#8A5D00;
  --btype-bg:#141B24;
  --btype-ink:#fff;
  --mark:#FFE9A8;
  --navbg:#FFFFFF;
  --shadow:0 1px 2px rgba(20,32,46,.05),0 3px 12px rgba(20,32,46,.07);
  --shadow-up:0 -2px 14px rgba(20,32,46,.10);
  --wizbg:#EEF1F4;

  --r:18px;
  --r-sm:11px;
  --mono:ui-monospace,"SFMono-Regular","SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B0F15;
  --bg-2:#10161E;
  --card:#161D27;
  --card-2:#1D2632;
  --ink:#EAEFF5;
  --ink-2:#BAC6D3;
  --dim:#7E90A3;
  --line:#27323F;
  --line-soft:#202B37;
  --accent:#F0576B;
  --accent-ink:#F58A9A;
  --accent-soft:#391B23;
  --accent-line:#57262F;
  --gold:#D9A83F;
  --gold-bg:#2A2310;
  --gold-line:#4A3D1C;
  --green:#4ADE9C;
  --green-bg:#12291F;
  --green-line:#1F4534;
  --warn-bg:#301A20;
  --code-bg:#2E2614;
  --code-ink:#E3B95C;
  --btype-bg:#3D4E60;
  --btype-ink:#EAEFF5;
  --mark:#5C4D14;
  --navbg:#10161E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 14px rgba(0,0,0,.28);
  --shadow-up:0 -2px 14px rgba(0,0,0,.4);
  --wizbg:#0B0F15;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:0}
input{font:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--mono)}

/* ---------- app bar ---------- */
.appbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg-2);
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-bottom:1px solid transparent;
  transition:background .25s ease;
}
.appbar.scrolled{border-bottom-color:var(--line-soft);box-shadow:var(--shadow)}
.appbar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar h1 .brandred{color:var(--accent)}
.appbar.sub h1{font-size:18px;font-weight:750}
.navbtn{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:grid;place-items:center;color:var(--ink);
  background:transparent;
}
.navbtn:active{background:var(--card-2)}
.navbtn svg{width:21px;height:21px;display:block}
.navbtn.saved-on{color:var(--accent)}
.stamp{
  font-family:var(--mono);font-size:10px;color:var(--dim);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap;
}
html[data-theme="dark"] .icon-moon{display:none}
html:not([data-theme="dark"]) .icon-sun{display:none}

/* ---------- layout ---------- */
#app{max-width:760px;margin:0 auto;padding:4px 16px calc(92px + env(safe-area-inset-bottom))}
.view{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);font-weight:700;margin:22px 2px 10px;
}
.eyebrow.red{color:var(--accent)}
.eyebrow:first-child{margin-top:12px}

/* ---------- home: search field ---------- */
.searchgo{
  width:100%;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:14px 20px;margin-top:10px;
  color:var(--dim);font-size:16px;text-align:left;
  box-shadow:var(--shadow);
}
.searchgo svg{width:19px;height:19px;flex:none}
.searchgo:active{background:var(--card-2)}

/* ---------- home: recently viewed ---------- */
.recentrow{
  display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;
  margin:0 -16px;padding:2px 16px 6px;
}
.recentrow::-webkit-scrollbar{display:none}
.recentcard{
  flex:none;width:230px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;box-shadow:var(--shadow);
}
.recentcard .rnum{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold)}
.recentcard .rname{
  font-size:15px;font-weight:650;margin-top:3px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.recentcard:active{background:var(--card-2)}

/* ---------- home: sections grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seccard{
  position:relative;text-align:left;overflow:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 15px 14px 18px;box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.seccard:active{transform:scale(.985);background:var(--card-2)}
.seccard:before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;
  border-radius:0 4px 4px 0;background:var(--sc,#888);
}
.seccard .snum{font-size:26px;font-weight:800;color:var(--sc,#888);line-height:1}
.seccard .sname{font-size:16.5px;font-weight:720;letter-spacing:-.01em;line-height:1.25;margin-top:10px}
.seccard .scount{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:8px}

/* home: updates banner */
.updbanner{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--card);border:1px solid var(--accent-line);
  border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);
}
.updbanner .ubico{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.updbanner .ubico svg{width:19px;height:19px}
.updbanner .ubt{flex:1;min-width:0}
.updbanner .ubname{display:block;font-weight:720;font-size:15px}
.updbanner .ubsub{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.updbanner:active{background:var(--card-2)}

/* ---------- section page ---------- */
.secdesc{color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:6px 2px 0}
.codestrip{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.code{
  font-family:var(--mono);font-size:12px;font-weight:650;
  background:var(--code-bg);color:var(--code-ink);
  border-radius:7px;padding:3px 9px;letter-spacing:.02em;white-space:nowrap;display:inline-block;
}
.code:before{content:"▸ ";font-size:9px}
.code.plain:before{content:""}

.plist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);margin-top:12px}
.prow{
  width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  padding:15px 15px;border-bottom:1px solid var(--line-soft);
}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--card-2)}
.prow .pnum{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);flex:none;min-width:34px}
.prow .pt{flex:1;min-width:0}
.prow .pname{font-size:15.5px;font-weight:650;line-height:1.35}
.prow .pmeta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.prow .chev{flex:none;color:var(--dim)}
.prow .chev svg{width:16px;height:16px;display:block}
.prow .psym{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.4}

/* ---------- process page ---------- */
.prochead{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 16px 15px 20px;box-shadow:var(--shadow);overflow:hidden;
  margin-top:12px;
}
.prochead:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc,var(--accent));
}
.prochead .peyebrow{
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
  letter-spacing:.06em;
}
.prochead .peyebrow .sep{color:var(--dim);margin:0 4px}
.prochead h2{margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.prochead .codestrip{margin:12px 0 0}
.tag{
  font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);
  border-radius:7px;padding:3px 9px;white-space:nowrap;display:inline-block;
}

.wizbtn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--accent);color:#fff;
  border-radius:999px;padding:15px 20px;margin:14px 0 4px;
  font-size:16.5px;font-weight:750;
  box-shadow:var(--shadow);
}
html[data-theme="dark"] .wizbtn{background:#F0576B;color:#1A0A0E}
.wizbtn svg{width:18px;height:18px}
.wizbtn:active{filter:brightness(1.08)}

/* flow */
.flow{margin-top:14px}
.fpill{
  display:flex;align-items:center;justify-content:center;gap:9px;
  border:1.5px solid var(--green-line);background:var(--green-bg);color:var(--green);
  border-radius:999px;padding:12px 18px;font-weight:700;font-size:15.5px;text-align:center;
}
.fpill .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.farrow{display:grid;place-items:center;color:var(--dim);padding:7px 0}
.farrow svg{width:16px;height:16px}
.fstep{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 15px 13px 18px;box-shadow:var(--shadow);overflow:hidden;
}
.fstep:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#7E9BD6}
.fstep.sup:before{background:var(--gold)}
.fstep .slbl{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;color:var(--dim);
}
.fstep.sup .slbl{color:var(--gold)}
.fstep .stxt{font-size:15.5px;line-height:1.5;margin-top:4px}
.fstep.sup{background:var(--gold-bg);border-color:var(--gold-line)}

/* notes */
.note{
  border-left:3px solid var(--dim);background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--dim);
  padding:11px 13px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:10px 0 0;
  font-size:13.5px;line-height:1.5;color:var(--ink-2);
}
.note.warn{border-left-color:var(--accent);background:var(--warn-bg);border-color:var(--accent-line)}
.note.upd{border-left-color:var(--gold);background:var(--gold-bg);border-color:var(--gold-line)}
.note b{color:var(--ink)}
.note .lbl{
  display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;margin-bottom:3px;color:var(--dim);
}
.note.warn .lbl{color:var(--accent-ink)}
.note.upd .lbl{color:var(--gold)}
.kbd{
  font-family:var(--mono);font-size:12px;font-weight:650;background:var(--card-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);white-space:nowrap;
}

/* ---------- wizard ---------- */
.wiz{position:fixed;inset:0;z-index:100;background:var(--wizbg);display:none;flex-direction:column}
.wiz.on{display:flex}
.wizhead{display:flex;align-items:center;gap:13px;padding:16px 16px 12px}
.wizx{
  width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--card-2);color:var(--ink);
}
.wizx svg{width:19px;height:19px}
.wizhead .wt{flex:1;min-width:0}
.wizhead .wname{font-size:16.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wizhead .wpos{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin-top:2px}
.wizbar{height:4px;background:var(--line-soft);border-radius:99px;margin:0 16px;overflow:hidden}
.wizbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.wizbody{flex:1;display:grid;place-items:center;padding:20px 16px;overflow:hidden;touch-action:pan-y}
.wizcard{
  width:100%;max-width:560px;
  background:var(--card);border:1px solid var(--line);border-radius:26px;
  padding:44px 26px 48px;text-align:center;box-shadow:var(--shadow);
  animation:wizIn .22s ease;
}
@keyframes wizIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.wizcard.back{animation:wizBack .22s ease}
@keyframes wizBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.wbadge{
  display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
  background:var(--card-2);color:var(--dim);border-radius:999px;padding:6px 16px;
}
.wbadge.start,.wbadge.done{background:var(--green-bg);color:var(--green)}
.wbadge.sup{background:var(--gold-bg);color:var(--gold)}
.wbadge.warn{background:var(--warn-bg);color:var(--accent-ink)}
.wnum{font-size:56px;font-weight:800;color:var(--accent);line-height:1.1;margin-top:16px}
.wnum.gold{color:var(--gold)}
.wtxt{font-size:23px;font-weight:650;line-height:1.35;margin-top:14px;letter-spacing:-.01em}
.wtxt.smaller{font-size:18px;font-weight:550}
.wtxt .code{font-size:.72em;vertical-align:2px}
.wsub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:14px}
.wizfoot{
  display:flex;gap:12px;padding:14px 16px calc(18px + env(safe-area-inset-bottom));
}
.wbtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:999px;padding:16px;font-size:17px;font-weight:700;
  background:var(--card);border:1px solid var(--line);color:var(--ink);
}
.wbtn svg{width:18px;height:18px}
.wbtn.primary{background:var(--accent);border-color:transparent;color:#fff}
html[data-theme="dark"] .wbtn.primary{background:#F0576B;color:#1A0A0E}
.wbtn:disabled{opacity:.4}
.wbtn:active:not(:disabled){filter:brightness(1.07)}

/* ---------- search ---------- */
.searchbox{position:relative;margin-top:10px}
.searchbox input{
  width:100%;padding:14px 46px 14px 46px;border-radius:999px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  font-size:16px;outline:none;box-shadow:var(--shadow);
}
.searchbox input::placeholder{color:var(--dim)}
.searchbox input:focus{border-color:var(--accent)}
.searchbox input::-webkit-search-decoration,
.searchbox input::-webkit-search-cancel-button,
.searchbox input::-webkit-search-results-button{-webkit-appearance:none;appearance:none}
.searchbox .sico{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--dim);display:grid;place-items:center}
.searchbox .sico svg{width:18px;height:18px}
.clearbtn{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:var(--card-2);color:var(--ink-2);
  width:30px;height:30px;border-radius:50%;display:none;
  align-items:center;justify-content:center;font-size:17px;line-height:1;
}
.clearbtn.on{display:flex}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px 4px}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;
}
.chip:active{background:var(--card-2)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}

/* ---------- menus / reference ---------- */
.subtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 2px;padding:0 16px 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:650;white-space:nowrap;flex:none;
}
.subtab.on{background:var(--accent);border-color:transparent;color:#fff}
html[data-theme="dark"] .subtab.on{background:#F0576B;color:#1A0A0E}
.mgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}
.mgroup > h3{
  margin:0;padding:11px 15px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;background:var(--card-2);
  border-bottom:1px solid var(--line);color:var(--ink-2);font-weight:700;
}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow .codes{flex:none;width:118px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mrow .purpose{font-size:14.5px;line-height:1.45;padding-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);font-weight:700;padding:9px 13px;
  border-bottom:1.5px solid var(--line);white-space:nowrap;
}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-family:var(--mono);font-weight:600;white-space:nowrap}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}

/* ---------- updates ---------- */
.ucard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-top:12px;box-shadow:var(--shadow);
}
.ucard .uhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ucard .udate{font-family:var(--mono);font-size:12px;color:var(--dim)}
.ucard h3{margin:9px 0 0;font-size:16.5px;font-weight:750;line-height:1.35;letter-spacing:-.01em}
.ucard .ubody{font-size:14px;line-height:1.55;color:var(--ink-2);margin-top:8px}
.ucard .usrc{margin-top:10px}
.badge{
  font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;white-space:nowrap;
}
.b-hot{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line)}
.b-ord{background:var(--btype-bg);color:var(--btype-ink)}
.extlink{color:var(--accent-ink);font-weight:650;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}

/* ---------- empty / disclaimer ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--dim)}
.empty .eico{margin:0 auto 12px;width:46px;height:46px;color:var(--line)}
.empty .eico svg{width:46px;height:46px}
.empty .big{font-size:15.5px;color:var(--ink-2);font-weight:650;margin-bottom:5px}
.disc{
  margin-top:26px;padding:14px 16px;border-radius:var(--r);
  background:var(--card-2);border:1px dashed var(--line);
  font-size:12px;line-height:1.55;color:var(--ink-2);
}
.disc b{color:var(--ink)}

/* ---------- bottom nav ---------- */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;align-items:stretch;
  background:var(--navbg);border-top:1px solid var(--line);
  box-shadow:var(--shadow-up);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  transition:background .25s ease;
}
.bitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--dim);min-width:0;padding:2px 0;
}
.bitem svg{width:22px;height:22px;display:block}
.bitem .blbl{font-size:11px;font-weight:650;letter-spacing:.01em}
.bitem.on{color:var(--accent)}

@media (min-width:640px){
  .grid{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* appbar inner alignment */
.appbar{display:block;padding:0}
.abin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%}
</style>

const norm = s => String(s).toLowerCase();
const strip = s => String(s).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function hl(html, term){
  if(!term) return html;
  const t = term.trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!t) return html;
  return html.replace(new RegExp("(?![^<]*>)("+t+")","ig"), "<mark>$1</mark>");
}
function matches(hay, term){
  if(!term) return true;

  return words.every(w => h.includes(w));
}

const SECMETA = {

const SECTIONS = [];
(function(){
  const m = new Map();
  PROC.forEach((p,idx)=>{
    if(!m.has(p.g)){
      const meta = SECMETA[p.g] || {c:"#888", d:""};
      m.set(p.g, SECTIONS.length);
      SECTIONS.push({name:p.g, color:meta.c, desc:meta.d, kind:"proc", items:[]});
    }

    desc:"When Finacle refuses: the errors that actually happen at the counter, and what clears them.",
    items: FIX.map((f,idx)=>idx)
  });
})();
function secOf(kind, idx){
  for(let s=0;s<SECTIONS.length;s++){
    const sec=SECTIONS[s];
    if(sec.kind!==kind) continue;
    const j=sec.items.indexOf(idx);
    if(j>-1) return {s, j};
  }
  return null;
}
const numOf = (kind, idx) => { const o=secOf(kind, idx); return o?(o.s+1)+"."+(o.j+1):""; };

/* ---------- recent / saved ---------- */
const K_RECENT="fd-recent", K_SAVED="fd-saved";
function pushRecent(key){
  let r = load(K_RECENT, []).filter(x=>x!==key);
  r.unshift(key); if(r.length>8) r=r.slice(0,8);
  store(K_RECENT, r);
}
const isSaved = key => load(K_SAVED, []).includes(key);
function toggleSaved(key){
  let s = load(K_SAVED, []);
  s = s.includes(key) ? s.filter(x=>x!==key) : [key].concat(s);
  store(K_SAVED, s);
}
function itemOf(key){
  const kind = key[0]==="f" ? "fix" : "proc";
  const idx = parseInt(key.slice(1),10);
  const arr = kind==="fix" ? FIX : PROC;
  if(!(idx>=0 && idx<arr.length)) return null;

}

/* ---------- search ---------- */
let q = "";
const CHIPS = ["CTM","Closure","Nomination","Cheque book","ATM card","Day-end","Silent account","Interest rates","Deceased claim"];
function procHay(p, pi){
  return [numOf("proc",pi), p.n, p.g, p.k, p.c.join(" "), p.s.map(x=>x.t).join(" "),
          (p.no||[]).map(x=>x.l+" "+x.t).join(" ")].join(" ").replace(/<[^>]+>/g,"");
}
function fixHay(f, fi){
  return [numOf("fix",fi), f.n, f.g, f.k, f.sym, f.body.map(b=>b.h+" "+b.t).join(" ")].join(" ").replace(/<[^>]+>/g,"");
}
function score(p, term){
  const w = norm(term).split(/\s+/).filter(Boolean);
  let s = 0;
  const name = norm(p.n), codes = norm((p.c||[]).join(" ")), keys = norm(p.k||"");
  w.forEach(x=>{
    if(codes.split(/\s+/).includes(x)) s += 100;
    else if(codes.includes(x))          s += 60;
    if(name.startsWith(x))              s += 40;
    else if(name.includes(x))           s += 30;
    if(keys.includes(x))                s += 10;
  });
  return s;
}

      '<span class="chev">'+I.chev+'</span></button>').join("")+'</div>';
  }
  let fixes = FIX.map((f,fi)=>({f,fi})).filter(o=>matches(fixHay(o.f,o.fi), q))
    .map(o=>({...o, sc:score({n:o.f.n,c:[],k:o.f.k+" "+o.f.sym},q)})).sort((a,b)=>b.sc-a.sc).slice(0,12);
  if(fixes.length){
    total += fixes.length;
    h += '<div class="eyebrow">Fixes</div><div class="plist">'+fixes.map(o=>
      '<button class="prow" data-nav="#fix/'+o.fi+'">'+
      '<span class="pnum">'+numOf("fix",o.fi)+'</span>'+
      '<span class="pt"><span class="pname">'+hl(esc(o.f.n),q)+'</span>'+
      '<span class="psym">'+hl(esc(o.f.sym),q)+'</span></span>'+
      '<span class="chev">'+I.chev+'</span></button>').join("")+'</div>';
  }
  const mrows = [];
  MENUS.forEach(grp=>grp.r.forEach(r=>{ if(matches(r.join(" ")+" "+grp.g, q)) mrows.push({g:grp.g, r}); }));
  if(mrows.length){
    total += mrows.length;
    h += '<div class="eyebrow">Menu codes</div><div class="mgroup">'+mrows.slice(0,15).map(o=>
      '<div class="mrow"><div class="codes">'+o.r.slice(1).map(codeChip).join("")+'</div>'+
      '<div class="purpose">'+hl(esc(o.r[0]),q)+' <span style="color:var(--dim);font-size:12px">· '+esc(o.g)+'</span></div></div>').join("")+'</div>';
  }
  const refRows = RATES.filter(r=>matches(r.join(" "),q)).map(r=>[r[0], r[1]])
    .concat(SCHEMES.filter(r=>matches(r.join(" "),q)))
    .concat(OFFACC.filter(r=>matches(r.join(" "),q)).map(r=>["SOL ID + "+r[0], r[1]]));
  if(refRows.length){
    total += refRows.length;
    h += '<div class="eyebrow">Reference</div><div class="tcard"><table class="tbl"><tbody>'+
      refRows.slice(0,12).map(r=>'<tr><td class="num">'+hl(esc(r[0]),q)+'</td><td>'+hl(esc(r[1]),q)+'</td></tr>').join("")+
      '</tbody></table></div>';
  }
  const news = NEWS.filter(n=>matches([n.d,n.o,n.t,n.b].join(" "), q));
  if(news.length){
    total += news.length;
    h += '<div class="eyebrow">Updates</div>'+news.slice(0,6).map(updCard).join("");
  }
  if(!total) return empty("Nothing matches that.","Try a menu code (CASBAO), a task (closure), or an error message.");
  return h;
}

/* ---------- menus / reference ---------- */
let menuTab = "codes";
const MENUTABS = [
  {id:"codes", label:"Menu codes"},
  {id:"rates", label:"Interest rates"},
  {id:"schemes", label:"Scheme codes"},
  {id:"offacc", label:"Office accounts"},
  {id:"manual", label:"Manual chapters"}
];
function vMenus(){
  bar('<h1>Menus & reference</h1>'+themeBtnHtml);
  let h = '<div class="subtabs">'+MENUTABS.map(t=>
    '<button class="subtab'+(t.id===menuTab?" on":"")+'" data-mtab="'+t.id+'">'+t.label+'</button>').join("")+'</div>';
  if(menuTab==="codes"){
    h += MENUS.map(grp=>'<div class="mgroup"><h3>'+esc(grp.g)+'</h3>'+
      grp.r.map(r=>'<div class="mrow"><div class="codes">'+r.slice(1).map(codeChip).join("")+'</div>'+
      '<div class="purpose">'+esc(r[0])+'</div></div>').join("")+'</div>').join("");
  } else if(menuTab==="rates"){
    h += '<div class="eyebrow">'+esc(RATE_ASON)+'</div>'+
      '<div class="tcard"><div class="scroller"><table class="tbl"><thead><tr><th>Scheme</th><th>Rate</th><th>How it is paid</th></tr></thead><tbody>'+
      RATES.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="num">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join("")+
      '</tbody></table></div></div>'+
      '<div class="note"><span class="lbl">Check before quoting</span>Rates are revised quarterly by the Ministry of Finance. Confirm against the latest SB Order before telling a depositor a figure.</div>';
  } else if(menuTab==="schemes"){
    h += '<div class="tcard"><div class="scroller"><table class="tbl"><thead><tr><th>Code</th><th>Product</th></tr></thead><tbody>'+
      SCHEMES.map(r=>'<tr><td class="num">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join("")+
      '</tbody></table></div></div>';
  } else if(menuTab==="offacc"){
    h += '<div class="eyebrow">SOL ID + suffix</div>'+
      '<div class="tcard"><div class="scroller"><table class="tbl"><thead><tr><th>Suffix</th><th>What it is</th></tr></thead><tbody>'+
      OFFACC.map(r=>'<tr><td class="num">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join("")+
      '</tbody></table></div></div>';
  } else {
    h += '<div class="eyebrow">POSB (CBS) Manual — corrected to 31.12.2021</div>'+
      '<div class="tcard"><div class="scroller"><table class="tbl"><thead><tr><th>Ch.</th><th>Subject</th><th>Page</th></tr></thead><tbody>'+
      CHAPTERS.map(r=>'<tr><td class="num">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="num">'+esc(r[2])+'</td></tr>').join("")+
      '</tbody></table></div></div>';
  }
  return h;
}

/* ---------- updates ---------- */
function updCard(n){
  return '<div class="ucard"><div class="uhead">'+
    '<span class="badge b-ord">'+esc(n.o)+'</span>'+
    '<span class="udate">'+esc(n.d)+'</span>'+
    (n.hi?'<span class="badge b-hot">affects counter work</span>':'')+
    '</div><h3>'+esc(n.t)+'</h3>'+
    '<div class="ubody">'+n.b+'</div>'+
    (n.u?'<div class="usrc"><a class="extlink" href="'+esc(n.u)+'" target="_blank" rel="noopener">Open the order / source ↗</a></div>':'')+
    '</div>';
}
function vUpdates(){
  bar('<h1>What changed</h1><span class="stamp">rev '+esc(REV).replace(/ /g,"·")+'</span>'+themeBtnHtml);
  return '<div class="secdesc" style="margin-top:10px">Orders and rulings issued after the POSB (CBS) Manual closed on 31.12.2021. The highlighted ones change what you do at the counter today.</div>'+
    NEWS.map(updCard).join("") + DISC();
}

/* ---------- saved ---------- */
function vSaved(){
  bar('<h1>Saved</h1>'+themeBtnHtml);
  const items = load(K_SAVED, []).map(itemOf).filter(Boolean);
  if(!items.length) return '<div class="empty"><div class="eico">'+I.bookmark+'</div>'+
    '<div class="big">Nothing saved yet.</div><div>Open any process and tap the bookmark to keep it here for one-tap access.</div></div>';
  return '<div class="plist" style="margin-top:14px">'+items.map(r=>
    '<button class="prow" data-nav="'+r.href+'">'+
    '<span class="pnum">'+r.num+'</span>'+
    '<span class="pt"><span class="pname">'+esc(r.it.n)+'</span>'+
    '<span class="pmeta"><span>'+esc(r.it.g)+'</span></span></span>'+
    '<span class="chev">'+I.chev+'</span></button>').join("")+'</div>';
}

/* ---------- wizard ---------- */
let wiz = null; /* {cards, idx, dir} */
function wizCards(p){
  const cards = [{k:"start", t:"Start — "+esc(p.n)}];
  p.s.forEach((st,i)=>cards.push({k:st.sup?"sup":"step", n:i+1, t:st.t}));
  (p.no||[]).filter(n=>n.k==="warn").forEach(n=>cards.push({k:"warn", l:n.l, t:n.t}));
  cards.push({k:"done", t:"Verified & complete"});
  return cards;
}
function openWiz(p){
  wiz = {cards:wizCards(p), idx:0, name:p.n, dir:1};
  history.pushState({wiz:1}, "");
  wizEl.classList.add("on");
  drawWiz();
}
function closeWiz(fromPop){
  if(!wiz) return;
  wiz = null;
  wizEl.classList.remove("on");
  if(!fromPop) history.back();
}
function drawWiz(){
  const c = wiz.cards[wiz.idx], total = wiz.cards.length;
  const pct = Math.round(((wiz.idx+1)/total)*100);
  let badge, body;
  if(c.k==="start"){
    badge = '<span class="wbadge start">Start</span>';
    body = '<div class="wtxt">'+c.t+'</div>';
  } else if(c.k==="done"){
    badge = '<span class="wbadge done">Complete</span>';
    body = '<div class="wtxt">'+c.t+'</div>';
  } else if(c.k==="warn"){
    badge = '<span class="wbadge warn">Caution</span>';
    body = '<div class="wtxt smaller">'+c.t+'</div>';
  } else {
    badge = '<span class="wbadge">Step</span>';
    body = '<div class="wnum'+(c.k==="sup"?" gold":"")+'">'+c.n+'</div>'+
      '<div class="wtxt">'+c.t+'</div>'+
      (c.k==="sup"?'<div class="wsub">Supervisor login</div>':'');
  }
  const last = wiz.idx===total-1;
  wizEl.innerHTML =
    '<div class="wizhead"><button class="wizx" id="wizX">'+I.x+'</button>'+
    '<div class="wt"><div class="wname">'+esc(wiz.name)+'</div>'+
    '<div class="wpos">'+(wiz.idx+1)+' of '+total+' · swipe through</div></div></div>'+
    '<div class="wizbar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="wizbody" id="wizBody"><div class="wizcard'+(wiz.dir<0?" back":"")+'">'+badge+body+'</div></div>'+
    '<div class="wizfoot">'+
    '<button class="wbtn" id="wizBack" '+(wiz.idx===0?"disabled":"")+'>'+I.back+'Back</button>'+
    '<button class="wbtn primary" id="wizNext">'+(last?I.check+"Done":"Next "+I.next)+'</button>'+
    '</div>';
}
function wizStep(d){
  if(!wiz) return;
  const nx = wiz.idx + d;
  if(nx < 0) return;
  if(nx >= wiz.cards.length){ closeWiz(); return; }
  wiz.idx = nx; wiz.dir = d; drawWiz();
}
wizEl.addEventListener("click", e=>{
  if(e.target.closest("#wizX")) closeWiz();
  else if(e.target.closest("#wizBack")) wizStep(-1);
  else if(e.target.closest("#wizNext")){
    if(wiz && wiz.idx===wiz.cards.length-1) closeWiz(); else wizStep(1);
  }
});
let tX = null;
wizEl.addEventListener("touchstart", e=>{ tX = e.touches[0].clientX; }, {passive:true});
wizEl.addEventListener("touchend", e=>{
  if(tX==null) return;
  const dx = e.changedTouches[0].clientX - tX; tX = null;
  if(Math.abs(dx) > 45) wizStep(dx < 0 ? 1 : -1);
}, {passive:true});
window.addEventListener("popstate", ()=>{ if(wiz) closeWiz(true); });

/* ---------- router ---------- */
let route = null;
function goHome(){ location.hash = "#home"; return ""; }
function render(){
  const hash = (location.hash || "#home").slice(1);
  const parts = hash.split("/");
  route = {view:parts[0]||"home", arg:parts[1]};
  let navActive = "home", html = "";
  switch(route.view){
    case "sec":     html = vSection(parseInt(route.arg,10)); break;
    case "proc":    html = vProc(parseInt(route.arg,10)); break;
    case "fix":     html = vFix(parseInt(route.arg,10)); break;
    case "search":  html = vSearch(); navActive = "search"; break;
    case "menus":   html = vMenus(); navActive = "menus"; break;
    case "updates": html = vUpdates(); navActive = "updates"; break;
    case "saved":   html = vSaved(); navActive = "saved"; break;
    default:        html = vHome(); navActive = "home";
  }
  appEl.innerHTML = '<div class="view">'+html+'</div>';
  drawNav(navActive);
  window.scrollTo({top:0});
  afterRender();
}
window.addEventListener("hashchange", ()=>{ if(!wiz) render(); });

function afterRender(){
  const qEl = $("#q");
  if(qEl){
    if(!q) setTimeout(()=>qEl.focus(), 60);
    let tmr;
    qEl.addEventListener("input", ()=>{
      clearTimeout(tmr);
      tmr = setTimeout(()=>{
        q = qEl.value.trim();
        $("#clr").classList.toggle("on", !!q);
        $("#chips").hidden = !!q;
        $("#results").innerHTML = resultsHtml();
      }, 130);
    });
    qEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); qEl.blur(); } });
    $("#clr").addEventListener("click", ()=>{
      qEl.value=""; q=""; $("#clr").classList.remove("on");
      $("#chips").hidden = false; $("#results").innerHTML = resultsHtml(); qEl.focus();
    });
    $("#chips").addEventListener("click", e=>{
      const b = e.target.closest(".chip"); if(!b) return;
      qEl.value = b.textContent; q = b.textContent;
      $("#clr").classList.add("on"); $("#chips").hidden = true;
      $("#results").innerHTML = resultsHtml();
    });
  }
  const saveBtn = $("#saveBtn");
  if(saveBtn){
    const key = route.view==="fix" ? "f"+route.arg : "p"+route.arg;
    saveBtn.addEventListener("click", ()=>{
      toggleSaved(key);
      saveBtn.classList.toggle("saved-on", isSaved(key));
      saveBtn.innerHTML = isSaved(key) ? I.bookmarkFill : I.bookmark;
    });
  }
  const wizGo = $("#wizGo");
  if(wizGo) wizGo.addEventListener("click", ()=>openWiz(PROC[parseInt(route.arg,10)]));
}

/* clicks: navigation + subtabs + theme */
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){ location.hash = nav.dataset.nav; return; }
  const mt = e.target.closest("[data-mtab]");
  if(mt){ menuTab = mt.dataset.mtab; render(); return; }
  if(e.target.closest("#themeBtn")){
    const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", cur);
    try{ localStorage.setItem("fd-theme", cur); }catch(err){}
  }
});

/* appbar shadow on scroll */
let sTick = false;
window.addEventListener("scroll", ()=>{
  if(sTick) return; sTick = true;
  requestAnimationFrame(()=>{
    barEl.classList.toggle("scrolled", window.scrollY > 6);
    sTick = false;
  });
}, {passive:true});


/* The Android shell calls this with the installed app's version name so
   colleagues can see which build they are on. */
window.setAppVersion = function(v){
  APP_VERSION = String(v || "").trim();
  if(!wiz) render();
};

render();
})();

</script>
