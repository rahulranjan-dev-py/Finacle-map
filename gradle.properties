org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# Shared signing keystore so every build installs as an update over the
# previous one (Android refuses updates signed with a different key).
# This app ships no secrets and is distributed privately, so keeping the
# keystore + password in the repo is a deliberate convenience trade-off.
FINACLEDESK_STORE_FILE=signing/finacledesk.jks
FINACLEDESK_STORE_PASSWORD=finacledesk2026
FINACLEDESK_KEY_ALIAS=finacledesk
FINACLEDESK_KEY_PASSWORD=finacledesk2026
