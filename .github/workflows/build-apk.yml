name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      # Version 1.0.<run number> matches versionName/versionCode in
      # app/build.gradle.kts, so the release, the APK and the "v…" shown
      # inside the app all agree.
      - name: Work out version and content revision
        id: meta
        run: |
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%d %b %Y')" >> "$GITHUB_OUTPUT"
          rev=$(sed -n 's/^let REV = "\(.*\)";/\1/p' app/src/main/assets/finacledesk.html | head -1)
          echo "rev=${rev:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk finacle-desk.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finacle-desk-v${{ steps.meta.outputs.version }}
          path: finacle-desk.apk

      # One numbered, published release per build, marked "Latest" so this
      # permanent link always serves the newest APK:
      #   https://github.com/rahulranjan-dev-py/Finacle-map/releases/latest/download/finacle-desk.apk
      - name: Publish release v${{ steps.meta.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
          REV: ${{ steps.meta.outputs.rev }}
          CHANGE: ${{ github.event.head_commit.message || 'Manual rebuild' }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # A draft left behind by an interrupted publish would shadow the tag;
          # remove any drafts so every release listed is a real, published one.
          gh release list --limit 50 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | while read -r draft; do
              [ -n "$draft" ] && gh release delete "$draft" --yes || true
            done

          cat > notes.md <<EOF
          **Version $VERSION** · build ${{ github.run_number }} · $DATE
          Content revision: SB Orders up to **$REV**

          **What changed in this build**
          $CHANGE

          **Install**
          Download \`finacle-desk.apk\` below and open it on the phone (allow
          "install from unknown sources" when asked). It installs over any older
          version in place — nothing to uninstall. The version shows in the
          app's top bar.
          EOF

          gh release create "$TAG" finacle-desk.apk \
            --title "Finacle Desk $TAG" \
            --notes-file notes.md \
            --latest \
            --target "$GITHUB_SHA"

          # Fail loudly if the release did not end up published with its asset.
          gh release view "$TAG" --json isDraft,url,assets \
            --jq 'if .isDraft then error("release is still a draft") elif (.assets|length)==0 then error("no asset attached") else "Published: \(.url)" end'
